name: management_memory

# Management Memory: READ-ONLY internal UI for inspecting the memory stack (Cognee).
# It joins the network and volumes of the `agents_memory_system` stack (external, read-only).

services:
  mm_docker_proxy:
    # Minimal Docker socket proxy: only GET for container list/inspect/logs/stats.
    image: wollomatic/socket-proxy:1.11.0
    restart: unless-stopped
    user: "0:0"   # owner of the socket in Docker Desktop; no capabilities (cap_drop ALL) and only GET allowed
    command:
      - -loglevel=INFO
      - -listenip=0.0.0.0
      - -allowfrom=mm_app
      # the proxy already anchors the expression (^...$): do not add your own anchors
      - '-allowGET=(/v[0-9.]+)?/(containers/(json|[a-f0-9]{12,64}/(json|logs|stats))|info|system/df)'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [mm_internal]

  mm_app:
    build: .
    restart: unless-stopped
    user: "10001:10001"   # the collector writes otlp*.json as uid 10001 (mode 0600)
    env_file: .env
    environment:
      COGNEE_API_URL: http://agents_cognee_api:8000
      COGNEE_MCP_URL: http://agents_cognee_mcp:8000
      INSPECTOR_PG_HOST: agents_postgres
      OBSERVER_URL: http://host.docker.internal:8017
      DOCKER_PROXY_URL: http://mm_docker_proxy:2375
      STACK_PROJECT: agents_memory_system
      TELEMETRY_DIR: /telemetry
      STORAGE_DIR: /cognee-storage
      OBSERVER_LOG: /observer/observer-events.log
      REGISTRY_FILE: /state/registry.json
      USAGE_FILE: /state/usage.jsonl
      HOST_AGENT_URL: http://host.docker.internal:8018
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MM_PORT:-45876}:8080"
    volumes:
      - agents_graph_data:/cognee-storage:ro
      - agents_telemetry_raw:/telemetry:ro
      - ${HOME}/.cognee-plugin/observer/observer-events.log:/observer/observer-events.log:ro
      - ${HOME}/.local/share/agents_memory_system/view:/state:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [mm_docker_proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8080/', headers={'Host':'127.0.0.1'}), timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [mm_internal, stack]

networks:
  mm_internal:
    internal: true
  stack:
    external: true
    name: agents_memory_system_agents_memory_net

volumes:
  agents_graph_data:
    external: true
    name: agents_memory_system_agents_graph_data
  agents_telemetry_raw:
    external: true
    name: agents_memory_system_agents_telemetry_raw
