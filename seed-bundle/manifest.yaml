# Machine-readable manifest of the seed bundle (bundle version = spec version).
bundle_version: 1.6
spec: spec/Cognee-memory-specification.md   # v1.6; step-by-step replica in section 21
tested_on:
  machine: Apple M1, 32 GB, macOS 26.6.2
  docker: Docker Desktop (Engine 27.5.1, Compose 2.32.4)
  claude_code: 2.1.311 (original 2.1.310; plugin requires >= 2.1.287)
  plugin: cognee-memory 1.7.4 (marketplace topoteretes/cognee-integrations @ e3addddc)
  cognee: 1.6.5
privacy:
  local_only: [Cognee API, MCP, PostgreSQL/pgvector, grafo Ladybug, embeddings (fastembed jina-v2-base-es), OTel collector, Management Memory]   # the panel code is downloaded from GitHub once; it sends no data
  leaves_the_mac: [document fragments to Claude (via observer) only when INDEXING, retrieved text within the Claude Code conversation]
panel:
  dir: panel/                  # ships inside the kit; no secrets (.env is generated per machine and is in .gitignore); override: MM_DIR
  read_only: true
launchagents:                # reversible (uninstall); no resident process except the observer
  observer: com.agents-memory.observer          # KeepAlive; installed by seed.sh machine
  host_stats: com.agents-memory.host-stats      # socket activation on :8018, only when pressing «Medir el Mac ahora»; installed by seed.sh panel
session_capture: on_with_caps   # COGNEE_CAPTURE=true; caps in deploy/docker/compose.yaml (spec 20.1)
ports:                       # all on 127.0.0.1
  mcp: 45873
  api: 45874
  otlp: 45875
  panel: 45876
  observer: 8017
language:
  field: .agent-memory/project.yaml -> language   # es | en
  detection: scripts/detect_language.py            # exit 0 = reliable; exit 2/3 = ASK THE USER
  ask_user_when: [LANG=unknown, CONFIDENCE < 0.75, repo mixto, repo casi vacio]
  templates: templates/<lang>/
phases:
  - id: doctor
    command: seed-bundle/seed.sh doctor
    changes_system: false
  - id: machine            # only once per Mac
    command: seed-bundle/seed.sh machine --yes
    unattended: true
    changes_system: [Docker containers, ~/.cognee-plugin/observer, deploy/docker/.env]
  - id: project            # once per repository
    command: seed-bundle/seed.sh project <repo> <project_id> --lang auto
    unattended: true                    # asks only if language/project type is ambiguous (exit 3); installs the plugin and sets up data projects (graph, catalog, discovery, live metadata)
  - id: corpus
    skill: project-memory-bootstrap
  - id: index
    command: seed-bundle/seed.sh index <repo>
    cost: ~2 Claude calls per chunk (reported at the end)
    unattended: true
  - id: panel              # Management Memory: part of the installation
    command: seed-bundle/seed.sh panel --yes
    unattended: true
    changes_system: [2 Docker containers (panel + read-only Docker socket proxy), launchd on-demand socket (127.0.0.1:8018)]
  - id: verify
    command: seed-bundle/seed.sh verify <repo>
deploy_ledger:             # per-branch deployment status, in the briefing
  script: scripts/memory_deploy.py   # record|status; record in <repo>/.agent-memory/deployments.json
  rule: record ONLY after verifying deployment health
never:
  - docker compose down -v
  - forget with everything
  - mount ~/.cognee-plugin/observer/ into a container
  - publish ports outside 127.0.0.1
  - store credentials or real sensitive data in memory documents
